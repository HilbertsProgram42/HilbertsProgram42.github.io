<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilbert's Program – links</title>
<meta name="description" content="All links of Hilbert's Program: free mathematics courses with full proofs – algebra, differential equations, and the Lean-verified proof of the Riemann hypothesis.">
<meta property="og:title" content="Hilbert's Program – links">
<meta property="og:description" content="Free mathematics courses with full proofs: algebra, differential equations, and a graduate-level course on the proof of the Riemann hypothesis.">
<meta property="og:url" content="https://hilbertsprogram42.github.io/links/">
<style>
  :root { --bg:#0f1116; --panel:#161a22; --line:#262c38; --text:#e8e6e1; --dim:#9aa3ad;
          --group:#5cc8e6; --sub:#7dd3a8; --gold:#e8b85c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         background-image: radial-gradient(700px 320px at 80% -10%, rgba(92,200,230,.16), transparent);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  main { max-width:480px; margin:0 auto; padding:56px 20px 40px; text-align:center; }
  .logo { width:84px; height:84px; margin:0 auto 16px; border-radius:50%; display:grid; place-items:center;
          border:1px solid var(--line); background:var(--panel); font:600 32px/1 Georgia, serif;
          display:flex; align-items:center; justify-content:center; letter-spacing:1px; }
  .logo .a { color:var(--group); } .logo .e { color:var(--gold); }
  h1 { font-size:24px; margin:0 0 4px; }
  .tag { color:var(--dim); margin:0 0 28px; font-size:15px; }
  .links { display:flex; flex-direction:column; gap:12px; }
  a.l { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px;
        background:var(--panel); border:1px solid var(--line); color:inherit; text-decoration:none;
        text-align:left; transition:border-color .15s, transform .15s; }
  a.l:hover, a.l:focus-visible { border-color:var(--group); transform:translateY(-1px); outline:none; }
  .ic { flex:0 0 44px; height:44px; border-radius:12px; display:grid; place-items:center;
        font-size:22px; font-weight:700; }
  .ic.sm { font-size:13px; letter-spacing:.04em; }
  a.l.primary { border-color:#FF0033; }
  .t { font-weight:600; } .s { display:block; color:var(--dim); font-size:13.5px; font-weight:400; }
  footer { margin-top:34px; color:var(--dim); font-size:13px; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><span class="a">H</span><span class="e">P</span></div>
  <h1>Hilbert's Program</h1>
  <p class="tag">Free mathematics courses – with every proof, exercises and solutions.</p>
  <nav class="links" id="links"></nav>
  <footer>Script and sheets under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a></footer>
</main>
<script>
// Add a URL to show a link; links with an empty URL stay hidden.
const SVG = {
  youtube: '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="0.5" y="3.5" width="23" height="17" rx="5" fill="#FF0033"/><path d="M9.6 8.2v7.6l6.6-3.8z" fill="#fff"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><g transform="translate(-0.9,-0.6)"><path fill="#25F4EE" d="M12.5.6h3.9c.1 1.5.6 3.1 1.8 4.2 1.1 1.1 2.7 1.6 4.2 1.8v4c-1.4 0-2.9-.4-4.2-1-.6-.3-1.1-.6-1.6-.9v8.8c-.1 1.4-.5 2.8-1.4 3.9-1.3 1.9-3.6 3.2-5.9 3.2-1.4.1-2.9-.3-4.1-1-2-1.2-3.4-3.4-3.7-5.7v-1.5c.2-1.9 1.1-3.7 2.6-5 1.7-1.4 4-2.1 6.2-1.7v4.4c-1-.3-2.2-.2-3 .4-.6.4-1.1 1-1.4 1.7-.2.5-.1 1.1-.1 1.6.2 1.6 1.8 3 3.5 2.9 1.1 0 2.2-.7 2.8-1.6.2-.3.4-.7.4-1.1.1-1.8.1-3.6.1-5.4V.6z"/></g><g transform="translate(0.9,0.6)"><path fill="#FE2C55" d="M12.5.6h3.9c.1 1.5.6 3.1 1.8 4.2 1.1 1.1 2.7 1.6 4.2 1.8v4c-1.4 0-2.9-.4-4.2-1-.6-.3-1.1-.6-1.6-.9v8.8c-.1 1.4-.5 2.8-1.4 3.9-1.3 1.9-3.6 3.2-5.9 3.2-1.4.1-2.9-.3-4.1-1-2-1.2-3.4-3.4-3.7-5.7v-1.5c.2-1.9 1.1-3.7 2.6-5 1.7-1.4 4-2.1 6.2-1.7v4.4c-1-.3-2.2-.2-3 .4-.6.4-1.1 1-1.4 1.7-.2.5-.1 1.1-.1 1.6.2 1.6 1.8 3 3.5 2.9 1.1 0 2.2-.7 2.8-1.6.2-.3.4-.7.4-1.1.1-1.8.1-3.6.1-5.4V.6z"/></g><path fill="#fff" d="M12.5.6h3.9c.1 1.5.6 3.1 1.8 4.2 1.1 1.1 2.7 1.6 4.2 1.8v4c-1.4 0-2.9-.4-4.2-1-.6-.3-1.1-.6-1.6-.9v8.8c-.1 1.4-.5 2.8-1.4 3.9-1.3 1.9-3.6 3.2-5.9 3.2-1.4.1-2.9-.3-4.1-1-2-1.2-3.4-3.4-3.7-5.7v-1.5c.2-1.9 1.1-3.7 2.6-5 1.7-1.4 4-2.1 6.2-1.7v4.4c-1-.3-2.2-.2-3 .4-.6.4-1.1 1-1.4 1.7-.2.5-.1 1.1-.1 1.6.2 1.6 1.8 3 3.5 2.9 1.1 0 2.2-.7 2.8-1.6.2-.3.4-.7.4-1.1.1-1.8.1-3.6.1-5.4V.6z"/></svg>',
};
// Add a URL to show a link; links with an empty URL stay hidden.
const LINKS = [
  { svg: "youtube", bg: "#2a0d12", title: "YouTube: all lectures", sub: "Algebra, differential equations and the Riemann film", url: "https://www.youtube.com/@HilbertsProgram", primary: true },
  { svg: "tiktok", bg: "#000000", title: "TikTok", sub: "Short lessons, one idea at a time", url: "https://www.tiktok.com/@hilbertsprogram" },
  { icon: "∑", color: "#0b1116", bg: "#5cc8e6", title: "The website", sub: "All courses, scripts, exercises and solutions", url: "https://hilbertsprogram42.github.io/" },
  { icon: "∀", color: "#0b1116", bg: "#5cc8e6", title: "Algebra – complete university course", sub: "Every episode with script, exercises and solutions", url: "https://hilbertsprogram42.github.io/algebra.html" },
  { icon: "y′", color: "#0b1116", bg: "#8fd694", title: "Differential Equations – complete university course", sub: "40 chapters in five long videos, with exam preparation", url: "https://hilbertsprogram42.github.io/#dgl" },
  { icon: "ζ", color: "#0b1116", bg: "#e8b85c", title: "The Riemann Theorem – graduate course", sub: "The Lean-verified proof, in four film parts", url: "https://hilbertsprogram42.github.io/#zeta" },
  { icon: "PDF", color: "#0b1116", bg: "#e8b85c", small: true, title: "Free scripts (PDF)", sub: "Algebra · Differential Equations · Riemann, each in one file", url: "https://hilbertsprogram42.github.io/#scripts" },
  { icon: "✎", color: "#0b1116", bg: "#7dd3a8", title: "Feedback & suggestions", sub: "Found a mistake? Want a topic? Tell us", url: "https://hp-feedback.hilbertsprogram.workers.dev/?ep=general&m=links" },
  { icon: "◎", color: "#fff", bg: "linear-gradient(45deg,#f9a825,#e1306c,#833ab4)", title: "Instagram", sub: "Short lessons as Reels", url: "" },
  { icon: "✉", color: "#0b1116", bg: "#c9ced6", title: "Email", sub: "hilbertsprogram.catering739@aleeas.com", url: "mailto:hilbertsprogram.catering739@aleeas.com" },
];
const nav = document.getElementById("links");
for (const l of LINKS) {
  if (!l.url) continue;
  const a = document.createElement("a");
  a.className = "l" + (l.primary ? " primary" : "");
  a.href = l.url;
  if (!l.url.startsWith("mailto:")) a.rel = "noopener";
  const ic = document.createElement("span"); ic.className = "ic" + (l.small ? " sm" : "");
  ic.style.background = l.bg;
  if (l.svg) ic.innerHTML = SVG[l.svg];
  else { ic.textContent = l.icon; ic.style.color = l.color; }
  const tx = document.createElement("span");
  const t = document.createElement("span"); t.className = "t"; t.textContent = l.title;
  const s = document.createElement("span"); s.className = "s"; s.textContent = l.sub;
  tx.append(t, s); a.append(ic, tx); nav.append(a);
}
</script>
</body>
</html>
